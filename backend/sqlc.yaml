version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/sql"
    schema: "migrations"
    gen:
      go:
        package: "queries"
        out: "internal/store/queries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
