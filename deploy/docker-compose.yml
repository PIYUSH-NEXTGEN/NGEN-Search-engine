services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
      POSTGRES_DB: community_search
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://community:community@postgres:5432/community_search?sslmode=disable
      REDIS_ADDR: redis:6379
      PORT: "8080"
      APP_ENV: development
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://localhost:3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
